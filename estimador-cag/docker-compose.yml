# Docker Compose configuration for local development.
# For production, remove the bind mounts and the --reload flag.
#
#   docker compose up --build
#
# API: http://localhost:8000  ·  Streamlit: http://localhost:8501

services:
  estimator:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: estimador-cag
    container_name: estimator
    ports:
      - "8000:8000"

    # Load environment variables (API keys, LLM provider config) from the local .env file.
    env_file:
      - .env

    # Bind-mount the app/ directory so code changes are reflected immediately
    # inside the container without rebuilding the image.
    volumes:
      - ./app:/app/app

    # Override the default CMD to enable auto-reload on file changes.
    # Remove --reload for production deployments.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    restart: unless-stopped

    # Health check using Python's stdlib (curl is not available in slim images).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3

  streamlit:
    # Same image as the API: streamlit is already one of the project dependencies.
    image: estimador-cag
    container_name: estimator-streamlit
    ports:
      - "8501:8501"

    # Reach the API through the Compose network, not localhost.
    environment:
      API_BASE_URL: http://estimator:8000

    volumes:
      - ./streamlit_app.py:/app/streamlit_app.py

    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true

    # The image's HEALTHCHECK probes the API port; point it at Streamlit instead.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3

    depends_on:
      estimator:
        condition: service_healthy

    restart: unless-stopped
